<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LIFE OS — Your Personal Operating System</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet" />
<style>
/* =============================================
   ROOT / THEME
   ============================================= */
:root {
  --bg: #0c0e14;
  --surface: #13161f;
  --surface2: #1b1f2e;
  --surface3: #22273a;
  --border: rgba(255,255,255,0.07);
  --text: #e8eaf0;
  --muted: #6b7280;
  --accent: #f0c040;

  --fitness: #f97316;
  --food:    #22c55e;
  --work:    #3b82f6;
  --finance: #a78bfa;
  --life:    #f472b6;
  --learn:   #06b6d4;

  --r: 14px;
  --transition: 0.3s cubic-bezier(.4,0,.2,1);
  --shadow: 0 4px 32px rgba(0,0,0,0.4);
}
[data-theme="light"] {
  --bg: #f4f5f9;
  --surface: #ffffff;
  --surface2: #eef0f6;
  --surface3: #e4e7f0;
  --border: rgba(0,0,0,0.08);
  --text: #1a1d28;
  --muted: #6b7280;
  --shadow: 0 4px 32px rgba(0,0,0,0.10);
}

/* =============================================
   RESET & BASE
   ============================================= */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-size: 15px;
  line-height: 1.65;
  min-height: 100vh;
  transition: background var(--transition), color var(--transition);
}
h1,h2,h3,h4,h5 { font-family: 'Syne', sans-serif; line-height: 1.2; }
a { color: inherit; text-decoration: none; }
ul { list-style: none; }
button { cursor: pointer; border: none; background: none; font-family: inherit; }
input[type="checkbox"] { accent-color: var(--accent); width: 16px; height: 16px; cursor: pointer; flex-shrink:0; }

/* =============================================
   STICKY HEADER
   ============================================= */
#header {
  position: sticky; top: 0; z-index: 100;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 20px;
  display: flex; align-items: center; justify-content: space-between;
  height: 58px;
  backdrop-filter: blur(12px);
  box-shadow: var(--shadow);
}
.header-logo {
  font-family: 'Syne', sans-serif;
  font-size: 18px; font-weight: 800; letter-spacing: -0.5px;
  display: flex; align-items: center; gap: 8px;
}
.header-logo span { color: var(--accent); }
.header-right { display: flex; align-items: center; gap: 12px; }
.date-badge {
  font-size: 12px; color: var(--muted);
  background: var(--surface2); border: 1px solid var(--border);
  padding: 4px 10px; border-radius: 20px; font-weight: 500;
}
.theme-toggle {
  width: 36px; height: 36px; border-radius: 50%;
  background: var(--surface2); border: 1px solid var(--border);
  font-size: 16px; display: flex; align-items: center; justify-content: center;
  transition: background var(--transition); color: var(--text);
}
.theme-toggle:hover { background: var(--surface3); }

/* =============================================
   HERO
   ============================================= */
#hero {
  padding: 32px 20px 24px; text-align: center; position: relative; overflow: hidden;
}
#hero::before {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(ellipse at 50% 0%, rgba(240,192,64,0.08) 0%, transparent 70%);
  pointer-events: none;
}
.hero-title {
  font-size: clamp(22px, 5vw, 38px); font-weight: 800; letter-spacing: -1px; margin-bottom: 8px;
}
.hero-title em { color: var(--accent); font-style: normal; }
.hero-subtitle { color: var(--muted); font-size: 14px; margin-bottom: 18px; }
#quote-box {
  display: inline-block;
  background: var(--surface); border: 1px solid var(--border);
  border-left: 3px solid var(--accent);
  padding: 12px 20px; border-radius: var(--r);
  max-width: 520px; font-size: 14px; font-style: italic; color: var(--muted);
  animation: fadeUp 0.6s ease both;
}

/* =============================================
   PROGRESS
   ============================================= */
#progress-bar-wrap {
  display: flex; align-items: center; justify-content: center; gap: 16px;
  margin: 16px 20px 0; flex-wrap: wrap;
}
.progress-label { font-size: 13px; color: var(--muted); }
.progress-track {
  flex: 1; max-width: 300px; height: 6px;
  background: var(--surface3); border-radius: 99px; overflow: hidden;
}
.progress-fill {
  height: 100%; border-radius: 99px;
  background: linear-gradient(90deg, var(--accent), #f97316);
  transition: width 0.5s ease;
}
.progress-pct { font-size: 13px; font-weight: 600; color: var(--accent); min-width: 32px; }

/* =============================================
   DAY NAV
   ============================================= */
#day-nav {
  display: flex; gap: 8px; padding: 20px 20px 0;
  overflow-x: auto; scrollbar-width: none;
}
#day-nav::-webkit-scrollbar { display: none; }
.day-btn {
  flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 10px 16px; border-radius: var(--r);
  background: var(--surface); border: 1px solid var(--border);
  color: var(--muted); font-family: 'Syne', sans-serif; font-size: 13px; font-weight: 600;
  transition: all var(--transition); position: relative; cursor: pointer;
}
.day-btn .day-abbr { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }
.day-btn .day-num { font-size: 18px; font-weight: 800; }
.day-btn:hover { background: var(--surface2); color: var(--text); }
.day-btn.active { background: var(--accent); color: #000; border-color: var(--accent); }
.day-btn.office-day::after {
  content: '🏢'; position: absolute; top: 4px; right: 4px; font-size: 9px;
}
.day-btn .day-dot {
  width: 6px; height: 6px; border-radius: 50%; background: var(--surface3);
  margin-top: 2px; transition: background var(--transition);
}
.day-btn.has-progress .day-dot { background: var(--fitness); }

/* =============================================
   WEEKLY STRIP
   ============================================= */
#weekly-strip {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r); padding: 16px 20px; margin: 16px 20px 0;
}
.ws-title {
  font-family: 'Syne', sans-serif; font-size: 11px; font-weight: 700; margin-bottom: 12px;
  color: var(--muted); letter-spacing: 1px; text-transform: uppercase;
}
.ws-days { display: flex; gap: 8px; }
.ws-day { flex: 1; text-align: center; }
.ws-day-label { font-size: 10px; color: var(--muted); margin-bottom: 4px; }
.ws-bar-wrap { height: 48px; display: flex; align-items: flex-end; justify-content: center; }
.ws-bar {
  width: 12px; border-radius: 4px 4px 0 0; background: var(--surface3);
  transition: height 0.5s ease, background 0.3s ease; min-height: 4px;
}
.ws-bar.has-data { background: linear-gradient(180deg, var(--accent), #f97316); }

/* =============================================
   MAIN
   ============================================= */
#main {
  max-width: 900px; margin: 0 auto; padding: 20px;
  display: flex; flex-direction: column; gap: 16px;
}

/* =============================================
   SECTION CARDS (Accordion)
   ============================================= */
.section-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r); overflow: hidden;
  transition: box-shadow var(--transition);
  animation: fadeUp 0.4s ease both;
}
.section-card:hover { box-shadow: var(--shadow); }
.section-header {
  display: flex; align-items: center; gap: 12px;
  padding: 16px 20px; cursor: pointer; user-select: none; position: relative;
}
.section-header::before {
  content: ''; position: absolute; left: 0; top: 0; bottom: 0;
  width: 3px; border-radius: 0 4px 4px 0;
}
.section-card[data-color="fitness"] .section-header::before { background: var(--fitness); }
.section-card[data-color="food"]    .section-header::before { background: var(--food); }
.section-card[data-color="work"]    .section-header::before { background: var(--work); }
.section-card[data-color="finance"] .section-header::before { background: var(--finance); }
.section-card[data-color="life"]    .section-header::before { background: var(--life); }
.section-card[data-color="learn"]   .section-header::before { background: var(--learn); }

.section-icon {
  width: 38px; height: 38px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; flex-shrink: 0;
}
.section-card[data-color="fitness"] .section-icon { background: rgba(249,115,22,0.15); }
.section-card[data-color="food"]    .section-icon { background: rgba(34,197,94,0.15); }
.section-card[data-color="work"]    .section-icon { background: rgba(59,130,246,0.15); }
.section-card[data-color="finance"] .section-icon { background: rgba(167,139,250,0.15); }
.section-card[data-color="life"]    .section-icon { background: rgba(244,114,182,0.15); }
.section-card[data-color="learn"]   .section-icon { background: rgba(6,182,212,0.15); }

.section-title-wrap { flex: 1; }
.section-title { font-family: 'Syne', sans-serif; font-size: 15px; font-weight: 700; }
.section-subtitle { font-size: 12px; color: var(--muted); }
.section-chevron { color: var(--muted); font-size: 18px; transition: transform 0.3s ease; }
.section-card.open .section-chevron { transform: rotate(180deg); }
.section-badge {
  font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 99px;
  background: var(--surface2); color: var(--muted);
}
.section-body {
  max-height: 0; overflow: hidden;
  transition: max-height 0.5s cubic-bezier(.4,0,.2,1);
}
.section-card.open .section-body { max-height: 5000px; border-top: 1px solid var(--border); }
.section-inner { padding: 20px; }

/* =============================================
   CHECKLIST
   ============================================= */
.checklist { display: flex; flex-direction: column; gap: 8px; }
.check-item {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 10px 14px; background: var(--surface2);
  border-radius: 10px; border: 1px solid var(--border);
  transition: all var(--transition); cursor: pointer;
}
.check-item:hover { background: var(--surface3); }
.check-item.done { opacity: 0.55; }
.check-item.done .check-label { text-decoration: line-through; color: var(--muted); }
.check-label { flex: 1; font-size: 14px; }
.check-meta { font-size: 11px; color: var(--muted); margin-top: 2px; }
.check-tag {
  font-size: 10px; font-weight: 700; letter-spacing: 0.5px;
  padding: 2px 7px; border-radius: 99px; flex-shrink: 0; align-self: center;
  text-transform: uppercase;
}
.tag-time { background: rgba(240,192,64,0.15); color: var(--accent); }
.tag-key  { background: rgba(249,115,22,0.15); color: var(--fitness); }
.tag-new  { background: rgba(167,139,250,0.15); color: var(--finance); }

/* =============================================
   SCHEDULE
   ============================================= */
.schedule { display: flex; flex-direction: column; gap: 2px; }
.time-block {
  display: flex; align-items: stretch; gap: 12px;
  padding: 8px 0; position: relative;
}
.time-block::before {
  content: ''; position: absolute; left: 58px; top: 0; bottom: 0;
  width: 1px; background: var(--border);
}
.tb-time {
  width: 56px; flex-shrink: 0; text-align: right;
  font-size: 11px; font-weight: 600; color: var(--muted); padding-top: 2px;
}
.tb-dot {
  width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
  margin-top: 5px; margin-left: -4px; z-index: 1; border: 2px solid var(--bg);
}
.tb-content {
  flex: 1; background: var(--surface2);
  border-radius: 10px; padding: 9px 13px; border: 1px solid var(--border);
}
.tb-title { font-size: 13px; font-weight: 600; }
.tb-desc { font-size: 12px; color: var(--muted); margin-top: 2px; }
.tb-current { border-color: var(--accent) !important; }

/* =============================================
   WORKOUT CARDS
   ============================================= */
.workout-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px,1fr)); gap: 12px; margin-top: 12px; }
.workout-card {
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 12px; padding: 14px;
  transition: transform var(--transition), box-shadow var(--transition);
}
.workout-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.2); }
.wc-name { font-family: 'Syne', sans-serif; font-size: 14px; font-weight: 700; margin-bottom: 4px; }
.wc-sets { font-size: 12px; color: var(--muted); }
.wc-link { display: inline-flex; align-items: center; gap: 4px; margin-top: 8px; font-size: 11px; color: var(--learn); }
.wc-link:hover { text-decoration: underline; }

/* =============================================
   MEAL CARDS
   ============================================= */
.meal-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px,1fr)); gap: 12px; margin-top: 12px; }
.meal-card {
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 12px; padding: 14px; border-left: 3px solid var(--food);
}
.mc-meal { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--food); margin-bottom: 4px; }
.mc-name { font-family: 'Syne', sans-serif; font-size: 14px; font-weight: 700; margin-bottom: 4px; }
.mc-detail { font-size: 12px; color: var(--muted); }
.mc-protein {
  display: inline-block; margin-top: 6px; font-size: 11px; font-weight: 600;
  color: var(--food); background: rgba(34,197,94,0.12); padding: 2px 8px; border-radius: 99px;
}

/* =============================================
   FINANCE SECTION
   ============================================= */
.finance-tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
.fin-tab {
  padding: 6px 14px; border-radius: 99px; font-size: 12px; font-weight: 600;
  background: var(--surface2); border: 1px solid var(--border); color: var(--muted);
  transition: all var(--transition); cursor: pointer;
}
.fin-tab.active { background: var(--finance); color: #fff; border-color: var(--finance); }
.fin-tab-content { display: none; }
.fin-tab-content.active { display: block; }

.concept-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(175px,1fr)); gap: 10px; margin-top: 10px; }
.concept-card {
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 12px; padding: 14px; cursor: pointer;
  transition: all var(--transition); border-left: 3px solid var(--finance);
}
.concept-card:hover { background: var(--surface3); transform: translateY(-1px); }
.cc-icon { font-size: 22px; margin-bottom: 6px; }
.cc-title { font-family: 'Syne', sans-serif; font-size: 13px; font-weight: 700; margin-bottom: 4px; }
.cc-desc { font-size: 12px; color: var(--muted); }

/* Stock Tracker */
.stock-tracker { display: grid; grid-template-columns: repeat(auto-fill, minmax(195px,1fr)); gap: 12px; margin-top: 12px; }
.stock-card {
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 12px; padding: 16px; transition: all var(--transition);
}
.stock-card:hover { background: var(--surface3); }
.sc-symbol { font-family: 'Syne', sans-serif; font-size: 16px; font-weight: 800; }
.sc-name { font-size: 11px; color: var(--muted); margin-bottom: 8px; }
.sc-price { font-size: 20px; font-weight: 700; margin-bottom: 2px; }
.sc-change { font-size: 12px; font-weight: 600; }
.sc-change.up { color: var(--food); }
.sc-change.down { color: #ef4444; }
.mini-chart { height: 40px; margin-top: 10px; }
.mini-chart svg { width: 100%; height: 100%; }
.sc-notes {
  width: 100%; background: var(--surface3); border: 1px solid var(--border);
  border-radius: 6px; padding: 6px 8px; font-size: 12px; color: var(--text);
  font-family: 'DM Sans', sans-serif; resize: none; min-height: 48px;
  margin-top: 10px; display: block;
}
.sc-notes:focus { outline: 2px solid var(--finance); }

.rules-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(195px,1fr)); gap: 10px; margin-top: 10px; }
.rule-card {
  display: flex; align-items: flex-start; gap: 10px;
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 10px; padding: 12px;
}
.rule-icon { font-size: 18px; flex-shrink: 0; }
.rule-text { font-size: 13px; }
.rule-text strong { display: block; margin-bottom: 2px; font-family: 'Syne', sans-serif; }
.rule-text span { font-size: 12px; color: var(--muted); }

.session-card {
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 12px; padding: 16px; margin-bottom: 10px;
  border-left: 3px solid var(--finance);
}
.session-title { font-family: 'Syne', sans-serif; font-size: 14px; font-weight: 700; margin-bottom: 4px; }
.session-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.session-tag {
  font-size: 11px; padding: 2px 8px; border-radius: 99px;
  background: rgba(167,139,250,0.1); color: var(--finance); font-weight: 600;
}

/* =============================================
   TIP BOX
   ============================================= */
.tip-box {
  display: flex; align-items: flex-start; gap: 10px;
  background: rgba(240,192,64,0.07); border: 1px solid rgba(240,192,64,0.2);
  border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; font-size: 13px;
}
.tip-icon { font-size: 16px; flex-shrink: 0; margin-top: 1px; }

/* =============================================
   LIFE CARDS
   ============================================= */
.life-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(195px,1fr)); gap: 10px; margin-top: 10px; }
.life-card {
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 12px; padding: 14px; border-top: 3px solid var(--life);
}
.lc-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--life); margin-bottom: 6px; }
.lc-title { font-family: 'Syne', sans-serif; font-size: 14px; font-weight: 700; margin-bottom: 4px; }
.lc-detail { font-size: 12px; color: var(--muted); }

/* =============================================
   HELPERS
   ============================================= */
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.chip-group { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chip {
  font-size: 12px; padding: 4px 12px; border-radius: 99px;
  background: var(--surface3); border: 1px solid var(--border);
  color: var(--muted); font-weight: 500;
}
.label {
  font-family: 'Syne', sans-serif; font-size: 11px; font-weight: 700;
  letter-spacing: 1px; text-transform: uppercase; color: var(--muted);
  margin-bottom: 10px; margin-top: 18px;
}
.label:first-child { margin-top: 0; }
.divider { border: none; border-top: 1px solid var(--border); margin: 16px 0; }

/* Office / Weekend banners */
.info-banner {
  display: flex; align-items: flex-start; gap: 10px;
  border-radius: 10px; padding: 12px 14px; margin-bottom: 16px; font-size: 13px;
  border: 1px solid;
}
.info-banner.office { background: rgba(59,130,246,0.1); border-color: rgba(59,130,246,0.2); }
.info-banner.weekend { background: rgba(167,139,250,0.08); border-color: rgba(167,139,250,0.2); }
.ib-icon { font-size: 18px; flex-shrink: 0; }

/* =============================================
   MODAL
   ============================================= */
#modal-overlay {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(0,0,0,0.7); backdrop-filter: blur(6px);
  display: flex; align-items: center; justify-content: center;
  padding: 20px; opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
}
#modal-overlay.open { opacity: 1; pointer-events: auto; }
#modal {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 18px; max-width: 480px; width: 100%; max-height: 80vh;
  overflow-y: auto; padding: 28px; position: relative;
  transform: translateY(20px); transition: transform 0.3s ease;
}
#modal-overlay.open #modal { transform: translateY(0); }
#modal-close {
  position: absolute; top: 16px; right: 16px;
  width: 32px; height: 32px; border-radius: 50%;
  background: var(--surface2); border: 1px solid var(--border);
  font-size: 16px; display: flex; align-items: center; justify-content: center;
  color: var(--muted); cursor: pointer;
}
#modal-title { font-family: 'Syne', sans-serif; font-size: 20px; font-weight: 800; margin-bottom: 10px; }
#modal-body { font-size: 14px; color: var(--muted); line-height: 1.8; }

/* =============================================
   ANIMATIONS
   ============================================= */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: translateY(0); }
}
.section-card:nth-child(1) { animation-delay: 0.05s; }
.section-card:nth-child(2) { animation-delay: 0.10s; }
.section-card:nth-child(3) { animation-delay: 0.15s; }
.section-card:nth-child(4) { animation-delay: 0.20s; }
.section-card:nth-child(5) { animation-delay: 0.25s; }
.section-card:nth-child(6) { animation-delay: 0.30s; }
.section-card:nth-child(7) { animation-delay: 0.35s; }

@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(240,192,64,0.3); }
  50% { box-shadow: 0 0 0 6px rgba(240,192,64,0); }
}
.current-pulse { animation: pulse 2s infinite; }

/* =============================================
   SCROLLBAR & MOBILE
   ============================================= */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--surface3); border-radius: 99px; }

@media (max-width: 600px) {
  #main { padding: 12px; }
  .section-inner { padding: 14px; }
  .section-header { padding: 14px; }
  .hero-title { font-size: 22px; }
  .workout-grid, .meal-grid, .concept-grid, .stock-tracker,
  .rules-grid, .life-grid, .two-col { grid-template-columns: 1fr; }
  .section-badge { display: none; }
}

footer { text-align: center; padding: 32px 20px; font-size: 12px; color: var(--muted); }
</style>

/* ========================================================
   MINI CHART SVG
   ======================================================== */
function miniSVG(data, up) {
  const W = 160, H = 40;
  const max = Math.max(...data), min = Math.min(...data);
  const range = max - min || 1;
  const pts = data.map((v, i) => {
    const x = (i / (data.length - 1)) * W;
    const y = H - ((v - min) / range) * (H - 4) - 2;
    return x + "," + y;
  }).join(" ");
  const c = up ? "#22c55e" : "#ef4444";
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="${c}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

/* ========================================================
   CHECK TOGGLE
   ======================================================== */
function ck(day, section, idx, el) {
  const key = day + "_" + section + "_" + idx;
  state.checks[key] = !state.checks[key];
  el.classList.toggle('done', !!state.checks[key]);
  const cb = el.querySelector('input[type=checkbox]');
  if (cb) cb.checked = !!state.checks[key];
  recalcProgress(day);
  persist();
}

function recalcProgress(day) {
  const allItems = document.querySelectorAll('.check-item');
  const total = allItems.length;
  let done = 0;
  allItems.forEach(item => { if (item.classList.contains('done')) done++; });
  const pct = total ? Math.round((done / total) * 100) : 0;
  const fill = document.getElementById('progress-fill');
  const pctEl = document.getElementById('progress-pct');
  if (fill) fill.style.width = pct + '%';
  if (pctEl) pctEl.textContent = pct + '%';
  state.weekProgress[day] = pct;
  renderWeekStrip();
  persist();
}

function scheduleHTML(day) {
  const blocks = buildSchedule(day);
  const now = new Date();
  const nowM = now.getHours() * 60 + now.getMinutes();
  const todayIdx = now.getDay() === 0 ? 6 : now.getDay() - 1;
  const isToday = day === DAYS[todayIdx];

  return '<div class="schedule">' + blocks.map((b, i) => {
    const parts = b.t.split(':').map(Number);
    const bM = parts[0] * 60 + (parts[1] || 0);
    const next = blocks[i + 1];
    const nM = next ? (next.t.split(':').map(Number).reduce((a, v, j) => j === 0 ? v * 60 : a + v, 0)) : bM + 60;
    const cur = isToday && nowM >= bM && nowM < nM;
    return `<div class="time-block">
      <div class="tb-time">${b.t}</div>
      <div class="tb-dot" style="background:${b.dot}"></div>
      <div class="tb-content ${cur ? 'tb-current current-pulse' : ''}">
        <div class="tb-title">${b.lbl}${cur ? ' <span style="font-size:10px;color:var(--accent);margin-left:6px;font-weight:800;">← NOW</span>' : ''}</div>
        <div class="tb-desc">${b.desc}</div>
      </div>
    </div>`;
  }).join('') + '</div>';
}

  const conceptCards = FINANCE_CONCEPTS.map((c, i) =>
    `<div class="concept-card" onclick="openModal('${c.icon} ${c.title}','${c.body.replace(/'/g, "&#39;")}')">
      <div class="cc-icon">${c.icon}</div>
      <div class="cc-title">${c.title}</div>
      <div class="cc-desc">${c.desc}</div>
    </div>`
  ).join('');

  const stockCards = STOCK_DEMO.map(s =>
    `<div class="stock-card">
      <div class="sc-symbol">${s.symbol}</div>
      <div class="sc-name">${s.name}</div>
      <div class="sc-price">${s.price}</div>
      <div class="sc-change ${s.up ? 'up' : 'down'}">${s.change} today</div>
      <div class="mini-chart">${miniSVG(s.spark, s.up)}</div>
      <textarea class="sc-notes" placeholder="Your observation about this company…" onchange="localStorage.setItem('note_${s.symbol}',this.value)">${localStorage.getItem('note_' + s.symbol) || ''}</textarea>
    </div>`
  ).join('');

  const checkItems = [
    { label: "Completed daily finance learning (15 min)", tag: "Daily", cls: "tag-new" },
    { label: "Noted 1 new concept in my finance journal", meta: "Use Notes app or physical notebook" },
    weekly
      ? { label: "Completed weekly deep session: " + weekly.session, tag: "KEY", cls: "tag-key" }
      : { label: "Observed 1 stock price movement", meta: "Just watch, no action needed" },
  ];

  return `
    <div class="tip-box">
      <span class="tip-icon">💡</span>
      <span>No prior knowledge needed. One concept at a time. Consistency beats intensity — 15 mins daily builds a strong foundation.</span>
    </div>

    <div class="finance-tabs">
      <button class="fin-tab active" onclick="swFin('learn',this)">📘 Learn</button>
      <button class="fin-tab" onclick="swFin('tracker',this)">📊 Stock Tracker</button>
      <button class="fin-tab" onclick="swFin('rules',this)">💡 Rules</button>
      <button class="fin-tab" onclick="swFin('today',this)">📅 Today</button>
    </div>

    <div class="fin-tab-content active" id="fin-learn">
      <div class="label">Tap any concept to learn</div>
      <div class="concept-grid">${conceptCards}</div>
    </div>

    <div class="fin-tab-content" id="fin-tracker">
      <div class="label">Demo Stock Tracker — observe, don't trade</div>
      <p style="font-size:13px;color:var(--muted);margin-bottom:12px;">Track these for a week. Notice price movements. Write your observations below each card.</p>
      <div class="stock-tracker">${stockCards}</div>
    </div>

    <div class="fin-tab-content" id="fin-rules">
      <div class="label">Golden Rules for Beginners</div>
      <div class="rules-grid">
        <div class="rule-card"><div class="rule-icon">🧠</div><div class="rule-text"><strong>Learn First, Invest Later</strong><span>Spend 3–6 months learning. Paper trade (pretend). No real money until confident.</span></div></div>
        <div class="rule-card"><div class="rule-icon">🚫</div><div class="rule-text"><strong>No Gambling Mindset</strong><span>Stock market ≠ casino. If someone promises guaranteed returns — run away.</span></div></div>
        <div class="rule-card"><div class="rule-icon">🐢</div><div class="rule-text"><strong>Long Term Always Wins</strong><span>Warren Buffett's average holding period: 20+ years. Patience is your strongest edge.</span></div></div>
        <div class="rule-card"><div class="rule-icon">📊</div><div class="rule-text"><strong>Diversify Always</strong><span>Never put more than 5–10% of your portfolio in any single stock. Spread the risk.</span></div></div>
        <div class="rule-card"><div class="rule-icon">🛡️</div><div class="rule-text"><strong>Emergency Fund First</strong><span>Keep 3–6 months of expenses liquid in a savings account BEFORE any investing.</span></div></div>
        <div class="rule-card"><div class="rule-icon">📱</div><div class="rule-text"><strong>Avoid Overtrading</strong><span>More trades = more fees + emotional mistakes. Buy quality, hold long. Less is more.</span></div></div>
        <div class="rule-card"><div class="rule-icon">📅</div><div class="rule-text"><strong>Start a SIP Today</strong><span>Even ₹500/month in a Nifty 50 index fund. The habit matters more than the amount.</span></div></div>
        <div class="rule-card"><div class="rule-icon">📰</div><div class="rule-text"><strong>Read, Don't React</strong><span>Headlines trigger fear and greed. Read Economic Times calmly. Ignore WhatsApp tips.</span></div></div>
      </div>
    </div>

    <div class="fin-tab-content" id="fin-today">
      <div class="label">Today's Finance Block (${day})</div>
      <div class="session-card">
        <div class="session-title">🌅 Daily Block — 15 mins</div>
        <div style="font-size:14px;margin-top:6px;color:var(--text)">${daily}</div>
      </div>
      ${weeklyBlock}
      <div class="label">Finance Checklist</div>
      ${checklistHTML(day, 'finance', checkItems)}
    </div>`;
}

/* ========================================================
   SECTION BUILDER
   ======================================================== */
function mkSection({ id, color, icon, title, sub, badge, content }) {
  const div = document.createElement('div');
  div.className = 'section-card';
  div.setAttribute('data-color', color);
  div.setAttribute('data-id', id);
  div.innerHTML = `
    <div class="section-header" onclick="toggleSec('${id}')">
      <div class="section-icon">${icon}</div>
      <div class="section-title-wrap">
        <div class="section-title">${title}</div>
        <div class="section-subtitle">${sub}</div>
      </div>
      ${badge ? `<span class="section-badge">${badge}</span>` : ''}
      <span class="section-chevron">⌄</span>
    </div>
    <div class="section-body"><div class="section-inner">${content}</div></div>`;
  return div;
}

function toggleSec(id) {
  const card = document.querySelector('[data-id="' + id + '"]');
  if (!card) return;
  const wasOpen = card.classList.contains('open');
  document.querySelectorAll('.section-card.open').forEach(c => c.classList.remove('open'));
  if (!wasOpen) card.classList.add('open');
}

/* ========================================================
   RENDER DAY
   ======================================================== */
function renderDay(day) {
  const main = document.getElementById('main');
  main.innerHTML = '';

  const isOffice = OFFICE_DAYS.includes(day);
  const isWeekend = day === 'Sat' || day === 'Sun';
  const gym = GYM_PLAN[day];
  const meals = MEALS[day];

  // Banners
  const officeBanner = isOffice
    ? `<div class="info-banner office"><div class="ib-icon">🏢</div><div>Office day! Commute: 1 hour each way. Lighter workout, easy prep meals. Use commute time for learning.</div></div>`
    : '';
  const weekendBanner = isWeekend
    ? `<div class="info-banner weekend"><div class="ib-icon">🌿</div><div>Weekend mode — recharge, explore, learn, and spend real quality time with your partner.</div></div>`
    : '';

  /* ----- SCHEDULE ----- */
  const schedCard = mkSection({
    id: 'schedule', color: 'work', icon: '🕐',
    title: 'Daily Schedule',
    sub: isOffice ? 'Office day — adjusted flow' : isWeekend ? 'Relaxed weekend flow' : 'Work from home flow',
    badge: isOffice ? '🏢 Office' : isWeekend ? '🌿 Weekend' : '🏠 WFH',
    content: officeBanner + weekendBanner + scheduleHTML(day)

  /* ----- FITNESS ----- */
  const workoutContent = gym.exercises.length
    ? `<div class="workout-grid">${gym.exercises.map(e =>
        `<div class="workout-card">
          <div class="wc-name">${e.name}</div>
          <div class="wc-sets">${e.sets}</div>

      ).join('')}</div>`

  const fitChecks = gym.exercises.length

        { label: "Hit protein target (~80–100g today)", meta: "Protein protects muscle during fat loss" },
        { label: "Avoided junk food & excess sugar", meta: "Small win compounding daily" },
      ]
    : [
        { label: "Rest day: light walk or stretch (20 min)", tag: "Easy", cls: "tag-time" },
        { label: "Drank 2.5L water today" },
        { label: "Sleep early tonight — recovery is training" },
      ];

  const fitCard = mkSection({
    id: 'fitness', color: 'fitness', icon: '🏋️',
    title: 'Fitness',
    sub: gym.label,
    badge: gym.exercises.length ? gym.exercises.length + ' exercises' : 'Rest',
    content: `
      <div class="label">Workout: ${gym.label}</div>
      ${workoutContent}
      <hr class="divider">
      <div class="label">Fitness Checklist</div>
      ${checklistHTML(day, 'fitness', fitChecks)}
      <hr class="divider">
      <div class="tip-box">
        <span class="tip-icon">🔥</span>
        <span><strong>Fat loss tip:</strong> Stay in a 300–400 cal deficit. Track daily steps (aim 8,000+). Sleep 7–8h. Protein at every meal. Progress > perfection.</span>
      </div>`
  });

  /* ----- FOOD ----- */
  const mealGrid = `<div class="meal-grid">${meals.map(m =>
    `<div class="meal-card">
      <div class="mc-meal">${m.meal}</div>
      <div class="mc-name">${m.name}</div>
      <div class="mc-detail">${m.detail}</div>
      <span class="mc-protein">${m.protein} protein</span>

  const foodCard = mkSection({
    id: 'food', color: 'food', icon: '🍳',
    title: 'Meal Plan',
    sub: 'South Indian · High Protein · Egg-friendly · Fast prep',
    badge: '~85–100g protein',
    content: `
      <div class="tip-box">
        <span class="tip-icon">🌿</span>
        <span><strong>Sunday prep trick:</strong> Cook dal + rice + boil 6 eggs in pressure cooker. Saves 45+ minutes every weekday morning.</span>

      <div class="label">Today's Meals</div>
      ${mealGrid}

        { label: "Snack: " + meals[2].name },
        { label: "Dinner: " + meals[3].name, tag: meals[3].protein, cls: "tag-time" },
        { label: "No random snacking / junk food today", meta: "If hungry, add a boiled egg" },
      ])}`
  });

  /* ----- WORK ----- */
  const workCard = mkSection({
    id: 'work', color: 'work', icon: '💼',
    title: 'Work & Upskilling',
    sub: '11AM–8PM work + 2hr Salesforce deep work',
    badge: 'Salesforce Dev',
    content: `
      <div class="label">Work System (11 AM – 8 PM)</div>
      ${checklistHTML(day, 'work', [
        { label: "Identified my 3 top tasks for today (before 11 AM)", tag: "Morning", cls: "tag-time" },
        { label: "Completed Salesforce deep work block (2 hrs, DND on)", tag: "KEY", cls: "tag-key" },
        { label: "Took micro-breaks every 90 min (5 min stand + stretch)", meta: "Prevents burnout, improves focus" },
        { label: "Batched Slack/email — max 3 check-ins today", meta: "Reactive = unproductive" },
        { label: "Reviewed 1 Salesforce concept or Trailhead module", meta: "15–20 min only" },
        { label: "Wrote tomorrow's top 3 tasks before logging off", meta: "Zero decision fatigue tomorrow morning" },
      ])}
      <hr class="divider">
      <div class="label">Salesforce Upskilling Focus Areas</div>
      <div class="chip-group">
        <span class="chip">Apex Programming</span>
        <span class="chip">Lightning Web Components</span>
        <span class="chip">Trailhead Modules</span>
        <span class="chip">Flow Builder</span>
        <span class="chip">SOQL Queries</span>
        <span class="chip">Admin Certification</span>
        <span class="chip">Integration APIs</span>
        <span class="chip">Data Modeling</span>
      </div>
      <div class="tip-box" style="margin-top:14px">
        <span class="tip-icon">🧠</span>
        <span><strong>Deep work rule:</strong> 90-min sprint → 10-min real break (no phone). One tab, one task, one goal. Your best Salesforce work happens in this window.</span>

  });

  /* ----- FINANCE ----- */
  const finCard = mkSection({

  /* ----- LIFE ----- */

        { label: "Dedicated quality time with partner (no phones)", tag: "❤️", cls: "tag-key" },
        { label: "1 hobby session (painting, exploring, creative time)", meta: "Protect this time — you need it" },
        day === 'Sun' ? { label: "Weekly review + planning for next week", meta: "15 min: what worked? what to improve?" } : { label: "Outdoor walk or nature time (30 min)", meta: "Recharge the mind" },
      ]
    : [
        { label: "Quality time with partner after work (8:30–9:30 PM)", tag: "❤️", cls: "tag-key" },
        { label: "Tidy workspace + room before sleep", meta: "Clean space = calm mind" },
        { label: "Prepared clothes + bag for tomorrow", meta: "Saves 10 min of morning decisions" },
        { label: "5-min journaling / gratitude before sleep", meta: "3 wins today + 1 intention for tomorrow" },
      ];

  const lifeCard = mkSection({
    id: 'life', color: 'life', icon: '❤️',
    title: 'Life & Wellness',

        <div class="life-card"><div class="lc-label">🎨 Hobbies</div><div class="lc-title">Creative Time</div><div class="lc-detail">Painting, exploring, reading — weekend afternoons. Non-negotiable recharge time.</div></div>
        <div class="life-card"><div class="lc-label">🌙 Sleep</div><div class="lc-title">Recovery Ritual</div><div class="lc-detail">Wind down 10 PM — dim lights, no screens, light reading, sleep 10:30–11 PM.</div></div>

      <div class="label">Life Checklist</div>
      ${checklistHTML(day, 'life', lifeChecks)}`

  /* ----- WEEKEND LEARNING ----- */
  let learnCard = null;
  if (isWeekend) {
    learnCard = mkSection({
      id: 'learn', color: 'learn', icon: '📚',
      title: 'Weekend Learning',
      sub: 'Salesforce · Finance · Growth · Reflection',
      badge: 'Flexible',
      content: `
        <div class="label">Choose 1–2 blocks this ${day}</div>
        <div class="two-col">
          <div class="life-card" style="border-top-color:var(--learn)"><div class="lc-label" style="color:var(--learn)">💼 Salesforce</div><div class="lc-title">Trailhead Sprint</div><div class="lc-detail">Complete 1 module, 1 project, or make progress on 1 superbadge</div></div>
          <div class="life-card" style="border-top-color:var(--finance)"><div class="lc-label" style="color:var(--finance)">📈 Finance</div><div class="lc-title">Market Deep Dive</div><div class="lc-detail">Watch 1 long-form video or read a chapter of an investing book (e.g. Rich Dad Poor Dad)</div></div>

        <div class="label">Weekend Learning Checklist</div>

          { label: "Completed 1 Salesforce / Trailhead module", tag: "Career", cls: "tag-key" },
          { label: "Completed finance deep session (45–60 min)", tag: "Finance", cls: "tag-new" },
          { label: "Weekly reflection journal written (15 min)", meta: "Wins + gaps + next week intentions" },
          { label: "Tech-free hour completed (walk / meditation)", meta: "Your brain needs offline time too" },
          day === 'Sun' ? { label: "Monday is planned — 3 top tasks written", meta: "Start Sunday night stress-free" } : { label: "Rest of weekend is intentionally planned" },
        ])}`
    });
  }

  [schedCard, fitCard, foodCard, workCard, finCard, lifeCard, learnCard]
    .filter(Boolean)
    .forEach(c => main.appendChild(c));

  setTimeout(() => {
    toggleSec('schedule');
    recalcProgress(day);
  }, 50);
}

/* ========================================================
   FINANCE TAB SWITCH
   ======================================================== */
function swFin(tab, btn) {
  document.querySelectorAll('.fin-tab').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.fin-tab-content').forEach(c => c.classList.remove('active'));
  btn.classList.add('active');
  const el = document.getElementById('fin-' + tab);
  if (el) el.classList.add('active');
}

/* ========================================================
   MODAL
   ======================================================== */
function openModal(title, body) {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').innerHTML = body;
  document.getElementById('modal-overlay').classList.add('open');
}
document.getElementById('modal-close').addEventListener('click', () => {
  document.getElementById('modal-overlay').classList.remove('open');
});
document.getElementById('modal-overlay').addEventListener('click', e => {
  if (e.target.id === 'modal-overlay') document.getElementById('modal-overlay').classList.remove('open');
});

/* ========================================================
   DAY NAV
   ======================================================== */
function renderDayNav() {
  const nav = document.getElementById('day-nav');
  nav.innerHTML = '';
  const now = new Date();
  const todayIdx = now.getDay() === 0 ? 6 : now.getDay() - 1;
  const monday = new Date(now);
  monday.setDate(now.getDate() - todayIdx);

  DAYS.forEach((day, i) => {
    const d = new Date(monday);
    d.setDate(monday.getDate() + i);
    const btn = document.createElement('button');
    btn.className = [
      'day-btn',
      day === state.activeDay ? 'active' : '',
      OFFICE_DAYS.includes(day) ? 'office-day' : '',
      (state.weekProgress[day] || 0) > 0 ? 'has-progress' : '',
    ].filter(Boolean).join(' ');
    btn.innerHTML = `<div class="day-abbr">${day}</div><div class="day-num">${d.getDate()}</div><div class="day-dot"></div>`;
    btn.addEventListener('click', () => {
      state.activeDay = day;
      renderDayNav();
      renderDay(day);
    });
    nav.appendChild(btn);
  });
}

/* ========================================================
   WEEKLY STRIP
   ======================================================== */
function renderWeekStrip() {
  const cont = document.getElementById('ws-days');
  if (!cont) return;
  cont.innerHTML = DAYS.map(d => {
    const pct = state.weekProgress[d] || 0;
    const h = Math.max(4, Math.round((pct / 100) * 44));
    return `<div class="ws-day">
      <div class="ws-day-label">${d}</div>
      <div class="ws-bar-wrap">
        <div class="ws-bar ${pct > 0 ? 'has-data' : ''}" style="height:${h}px" title="${pct}%"></div>
      </div>
    </div>`;
  }).join('');
}

/* ========================================================
   QUOTE
   ======================================================== */
function setQuote() {
  const q = QUOTES[new Date().getDay() % QUOTES.length];
  document.getElementById('quote-box').innerHTML = `"${q}"`;
}

/* ========================================================
   DATE BADGE
   ======================================================== */
function setDate() {
  const now = new Date();
  document.getElementById('date-badge').textContent = now.toLocaleDateString('en-IN', {
    weekday: 'short', month: 'short', day: 'numeric'
  });
}

/* ========================================================
   THEME TOGGLE
   ======================================================== */
document.getElementById('theme-btn').addEventListener('click', () => {
  state.theme = state.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', state.theme);
  document.getElementById('theme-btn').textContent = state.theme === 'dark' ? '🌙' : '☀️';
  persist();
});
document.getElementById('theme-btn').textContent = state.theme === 'dark' ? '🌙' : '☀️';

/* ========================================================
   INIT
   ======================================================== */
setQuote();
setDate();
renderDayNav();
renderWeekStrip();
renderDay(state.activeDay);
</script>
</body>
</html>
